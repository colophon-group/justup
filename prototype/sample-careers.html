<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample company career page</title><style>*{box-sizing:border-box}body{background:#f9e7d4;color:#11100e;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0}.notice{background:#11100e;color:#f9e7d4;font:11px/1.6 ui-monospace,monospace;padding:13px 25px;text-align:center}main{max-width:780px;margin:70px auto;padding:0 25px}h1{font-size:clamp(34px,7vw,57px);line-height:1.12;letter-spacing:-1.5px;margin:35px 0 20px}.company{font-size:22px;font-weight:800;border-bottom:2px solid;padding-bottom:20px}.source{font:12px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.explanation{padding:22px 0;max-width:600px}.small{font-size:12px}button{color:inherit;font-size:13px;font-weight:700;border:0;border-bottom:1px solid;background:none;padding:0;cursor:pointer}</style></head><body><div class="notice">PROTOTYPE · Sample company career page</div><main><div class="company" id="company"></div><h1 id="page"></h1><p class="source" id="source"></p><div class="explanation"><p>In Justup, this link opens the company’s own career page.</p><p class="small">This is a fictional company used in the demo. You can close this tab and continue browsing your edition.</p></div><button onclick="window.close()">Close this sample tab ↗</button></main><script>const values=new URLSearchParams(location.search);for(const key of ['company','page','source'])document.getElementById(key).textContent=values.get(key)||'';document.title=(values.get('page')||'Careers')+' — '+(values.get('company')||'Sample company');</script></body></html>
